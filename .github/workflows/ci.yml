name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eventnet-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ORT_DISABLE_TELEMETRY: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up isolated ML Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install hash-pinned CPU experiment dependencies
        run: python -m pip install -r ml/requirements-eventnet.txt
      - name: Test EventNet with generated evidence only
        run: |
          python -m compileall -q ml tests/tool/test_eventnet.py tests/tool/test_calibration.py
          python -m pip check
          python -W error::ResourceWarning -m unittest tests.tool.test_eventnet tests.tool.test_calibration
      - name: Install isolated hash-pinned mobile export additions
        run: |
          python -m pip install --no-deps -r ml/requirements-mobile.txt
          python -m pip check
          python -W error::ResourceWarning -m unittest tests.tool.test_mobile_export tests.tool.test_mobile_apk
          python -m ml.mobile_smoke .dart_tool/mobile-ci-assets
      - name: Set up Java for isolated benchmark
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Verify native benchmark numeric helpers
        run: |
          mkdir -p .dart_tool/mobile-java-tests
          javac -d .dart_tool/mobile-java-tests ml/android-benchmark/src/main/java/io/github/atrx07/traelyx/mlbenchmark/BenchmarkMath.java tests/tool/MobileBenchmarkMathTest.java
          java -cp .dart_tool/mobile-java-tests MobileBenchmarkMathTest
      - name: Prepare verified runtime and Gradle for isolated APK
        run: |
          mkdir -p .dart_tool/m7-runtime-review
          curl --fail --location --silent --show-error --retry 3 --max-time 120 https://repo.maven.apache.org/maven2/com/microsoft/onnxruntime/onnxruntime-android/1.32.0/onnxruntime-android-1.32.0.aar -o .dart_tool/m7-runtime-review/onnxruntime-android-1.32.0.aar
          printf '%s  %s\n' 8e8dbb412ed4939675a157702f0c1e3621b436a645af7f7244536ac20bfad628 .dart_tool/m7-runtime-review/onnxruntime-android-1.32.0.aar | sha256sum --check --status
          asset="$RUNNER_TEMP/mobile-gradle-9.1.0-all.zip"
          curl --fail --location --silent --show-error --retry 3 --max-time 180 --header 'Accept: application/octet-stream' https://api.github.com/repos/gradle/gradle-distributions/releases/assets/294652018 --output "$asset"
          printf '%s  %s\n' b84e04fa845fecba48551f425957641074fcc00a88a84d2aae5808743b35fc85 "$asset" | sha256sum --check --status
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/gradle-9.1.0-all/7wzd0jkjit61aq2p43wpjgij9"
          mkdir -p "$cache"
          mv "$asset" "$cache/gradle-9.1.0-all.zip"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build lint and verify permission-free standalone benchmark
        run: |
          android/gradlew -p ml/android-benchmark -PexportDir="$GITHUB_WORKSPACE/.dart_tool/mobile-ci-assets" assembleDebug lintDebug --no-daemon
          apk=ml/android-benchmark/build/outputs/apk/debug/TraelyxMlBenchmark-debug.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print "$apk" > .dart_tool/mobile-manifest.xml
          python -m ml.verify_mobile_apk "$apk" .dart_tool/mobile-manifest.xml

  guardian-dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Check and test isolated Guardian Edge functions
        run: |
          npx --yes --package=deno@2.9.6 deno fmt --check supabase/functions
          npx --yes --package=deno@2.9.6 deno lint supabase/functions
          npx --yes --package=deno@2.9.6 deno check supabase/functions/guardian-dispatch/index.ts
          npx --yes --package=deno@2.9.6 deno check supabase/functions/guardian-capability/index.ts
          npx --yes --package=deno@2.9.6 deno test --no-prompt supabase/functions/tests/guardian_dispatch.test.mjs
          npx --yes --package=deno@2.9.6 deno test --no-prompt supabase/functions/tests/guardian_capability.test.mjs
          npx --yes --package=deno@2.9.6 deno test --no-prompt supabase/functions/tests/processing_window.test.mjs
      - name: Verify bundled production entrypoints and warm expiry
        run: |
          mkdir -p .dart_tool
          npx --yes --package=deno@2.9.6 deno bundle --platform deno --no-remote --no-npm --no-config --no-lock -o .dart_tool/guardian-capability-window.bundle.js supabase/functions/guardian-capability/index.ts
          npx --yes --package=deno@2.9.6 deno bundle --platform deno --no-remote --no-npm --no-config --no-lock -o .dart_tool/guardian-dispatch-window.bundle.js supabase/functions/guardian-dispatch/index.ts
          node --test tests/tool/test_guardian_processing_bundle.mjs

      - name: Test bounded recipient offline operator
        run: node --test tests/tool/test_guardian_recipient_offline.mjs

  cloud-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: traelyx_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d traelyx_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGPASSWORD: postgres
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply cloud schema and test grants/RLS
        run: |
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260925000000_connected_foundation.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260925010000_harden_rls_helper.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260926000000_summary_auth_owner.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260926010000_profile_vehicle_sync.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260926020000_metadata_account_guard.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260926030000_friendships.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260926040000_safe_rankings.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260927000000_guardian_pairing.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260927010000_guardian_alert_delivery.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20260927020000_guardian_dispatch_worker.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_driver_revisions_upgrade.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/migrations/20261014000000_guardian_driver_revisions.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/connected_foundation.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/summary_sync.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/profile_vehicle_sync.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/friendships.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/safe_rankings.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_pairing.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_alert_delivery.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_recipient_registration.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_dispatch_worker.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_receipt_fixture.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_push_fixture.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_receiver_controls.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_driver_revisions.sql
          psql -h localhost -U postgres -d traelyx_test -v ON_ERROR_STOP=1 -f supabase/tests/guardian_two_account_fixture.sql
          node --test tests/tool/test_guardian_push_probe.mjs
          node --test tests/tool/test_guardian_duplicate_phone.mjs

      - name: Test bounded Guardian pair operator gates
        shell: pwsh
        run: ./tests/tool/test_guardian_duplicate_pair.ps1

  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.44.9
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Precache checksum-verified SQLite for Linux and Android
        run: |
          # sqlite3 3.5.1's default release URL can cache an HTTP 504 body.
          # Use its immutable official asset API, retaining the published SHA-256/cache key.
          while read -r asset_id expected; do
            cache=.dart_tool/hooks_runner/shared/sqlite3/build/download-${expected:0:8}
            asset="$RUNNER_TEMP/traelyx-libsqlite3-${asset_id}.so"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 90 \
              --header 'Accept: application/octet-stream' \
              "https://api.github.com/repos/simolus3/sqlite3.dart/releases/assets/${asset_id}" \
              --output "$asset"
            printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --status
            mkdir -p "$cache"
            mv "$asset" "$cache/libsqlite3.so"
          done <<'ASSETS'
          501022946 b17729184e5a2818055ecbddd5ed6642521bfe6e56aafa472330e483c0e2e0d2
          501022904 a42fa9d0f5c006d30b000d4904bc497705191c5d7330b178618546004295bb49
          501022915 0c2d3bfc8c87abceb21ed72a4bb49964121c5fe1a8ef3848d83ba907d01b6161
          501022939 949965f0eba976f707ae364cdcb42c342b5f0626081f8d7f0378fb7b52848772
          ASSETS

      - name: Verify generated sources
        run: |
          dart run build_runner build
          git diff --exit-code

      - name: Verify Drift schema snapshots
        run: |
          # Substantive upgrade/data-preservation tests live in test/core/database/migrations.
          dart run drift_dev make-migrations --no-test
          dart run drift_dev schema generate drift_schemas/app_database test/core/database/migrations/generated --data-classes --companions
          dart format test/core/database/migrations/generated
          git diff --exit-code -- drift_schemas test/core/database/migrations/generated

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Test trip-debug inspector
        run: python -m unittest tests.tool.test_inspect_tripdebug

      - name: Validate offline ML dataset registry and imports
        run: |
          python -m compileall -q ml tests/tool/test_ml_datasets.py
          python ml/datasets.py validate
          python -W error::ResourceWarning -m unittest tests.tool.test_ml_datasets

      - name: Validate repository contracts and secrets
        run: dart run tool/validate_repository.dart

      - name: Precache checksum-verified Gradle distribution
        run: |
          # Same distribution as the wrapper; its release URL can cache HTTP 504.
          grep -Fxq 'distributionUrl=https\://services.gradle.org/distributions/gradle-9.1.0-all.zip' android/gradle/wrapper/gradle-wrapper.properties
          expected=b84e04fa845fecba48551f425957641074fcc00a88a84d2aae5808743b35fc85
          asset="$RUNNER_TEMP/traelyx-gradle-9.1.0-all.zip"
          curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 180 \
            --header 'Accept: application/octet-stream' \
            https://api.github.com/repos/gradle/gradle-distributions/releases/assets/294652018 \
            --output "$asset"
          printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --status
          # Gradle wrapper's existing URL-derived cache key; update with its version/URL.
          cache="${GRADLE_USER_HOME:-$HOME/.gradle}/wrapper/dists/gradle-9.1.0-all/7wzd0jkjit61aq2p43wpjgij9"
          mkdir -p "$cache"
          mv "$asset" "$cache/gradle-9.1.0-all.zip"

      - name: Prepare checksum-verified Kotlin compiler mirror
        run: |
          # Flutter's Gradle plugin and the app use these existing compiler versions.
          # Preserve their exact bytes when the Maven/GitHub download path returns 504.
          mirror="$RUNNER_TEMP/traelyx-compiler-maven"
          while read -r version asset_id expected pom_hash; do
            filename="kotlin-compiler-embeddable-${version}.jar"
            asset="$RUNNER_TEMP/$filename"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 120 \
              --header 'Accept: application/octet-stream' \
              "https://api.github.com/repos/JetBrains/kotlin/releases/assets/${asset_id}" \
              --output "$asset"
            printf '%s  %s\n' "$expected" "$asset" | sha256sum --check --status
            cache="$mirror/org/jetbrains/kotlin/kotlin-compiler-embeddable/$version"
            mkdir -p "$cache"
            mv "$asset" "$cache/$filename"
            pom="$cache/kotlin-compiler-embeddable-${version}.pom"
            curl --fail --location --silent --show-error --retry 3 --connect-timeout 20 --max-time 60 \
              "https://repo.maven.apache.org/maven2/org/jetbrains/kotlin/kotlin-compiler-embeddable/${version}/kotlin-compiler-embeddable-${version}.pom" \
              --output "$pom"
            printf '%s  %s\n' "$pom_hash" "$pom" | sha256sum --check --status
          done <<'ASSETS'
          2.2.20 587886256 1c6c3f810bfe6a41abcbc34b3a2ef639f1e3f4aeed3a953a4b0974eea4f41889 05ff025f7fb0932fb11fa1e1ccaef528f76027d956680f8835d438542762e20a
          2.3.20 598623291 976f989d0b5f5d80e8e8a8ad4b73da0bfc27fdd965b9fa38362b2be79ecc1337 0c35aeee372f07514ebed37b9407b8e1181d1427755139e5cee7719ca05fe7e8
          ASSETS
          init_dir="${GRADLE_USER_HOME:-$HOME/.gradle}/init.d"
          mkdir -p "$init_dir"
          cp tool/ci/verified_compiler_mirror.init.gradle "$init_dir/traelyx-verified-compilers.gradle"
          printf 'TRAELYX_CI_COMPILER_MIRROR=%s\n' "$mirror" >> "$GITHUB_ENV"

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Test native Kotlin
        working-directory: android
        run: ./gradlew testDebugUnitTest

      - name: Build release-validation APK
        run: flutter build apk --release

      - name: Report APK size
        run: dart run tool/report_apk_size.dart

      - name: Upload APK and size report
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: traelyx-debug
          path: |
            build/app/outputs/flutter-apk/app-debug.apk
            build/app/outputs/flutter-apk/app-release.apk
            build/reports/apk-size.json
          if-no-files-found: error
