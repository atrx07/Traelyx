schema_version: 1
release_type: github_signed_android_apk
checks:
  source:
    - clean_worktree_or_documented_state
    - version_tag_matches_build
    - governance_status_updated
  quality:
    - format
    - static_analysis
    - unit_tests
    - integration_fixture_tests
    - json_yaml_schema_validation
    - secret_scan
  android:
    - release_build
    - signature_verify
    - clean_install
    - upgrade_install_from_previous_signed_release
    - locked_screen_recorder_smoke_test
  persistence:
    - database_migration_test
    - representative_trip_history_preserved
  privacy_security:
    - permission_diff_review
    - rls_review_if_cloud_changed
    - provider_payload_review_if_commentary_changed
    - no_signing_or_api_secrets_in_artifacts
  performance:
    - apk_size_report
    - bundled_model_size_report
    - critical_regression_review
  publish:
    - sha256_checksums
    - release_notes
    - known_issues
    - scoring_model_version_changes_noted
