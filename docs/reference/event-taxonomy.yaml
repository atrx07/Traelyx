schema_version: 1
algorithm_version: 1
status: implemented_m4_3
notes:
  - The ten M4.1 machine IDs are locked for event-taxonomy version 1.
  - Detection is evidence, not moral judgment or final scoring.
  - M4.1 emits per-analysis-window evidence; M4.2 deterministically merges it into maneuver events.
  - Debounced groups remain available as explicit audit decisions instead of disappearing silently.
  - M4.3 emits categorical integrity findings; only inconsistency-kind findings use EVT_TELEMETRY_INCONSISTENCY.
  - Thresholds are deterministic synthetic baselines, not claims of empirical population calibration.
  - Missing or invalidated required metric evidence emits no maneuver candidate; degraded usable evidence is limited.

activation_defaults:
  strong_acceleration_mps2: 1.5
  strong_braking_mps2: 2.5
  high_lateral_load_mps2: 2.0
  abrupt_longitudinal_jerk_mps3: 3.5
  abrupt_longitudinal_minimum_acceleration_mps2: 0.75
  abrupt_lateral_jerk_mps3: 3.5
  abrupt_corner_minimum_lateral_load_mps2: 0.75
  road_impact_vertical_acceleration_mps2: 1.0
  road_impact_vertical_jerk_mps3: 5.0

merge_defaults:
  merge_version: 1
  maximum_same_type_peak_gap_ms: 250
  minimum_sustained_window_count: 3
  sustained_event_ids:
    - EVT_ACCEL_STRONG
    - EVT_BRAKE_STRONG
    - EVT_CORNER_HIGH_LOAD_LEFT
    - EVT_CORNER_HIGH_LOAD_RIGHT
  transient_minimum_window_count: 1
  transient_event_ids:
    - EVT_ACCEL_ABRUPT_TRANSITION
    - EVT_BRAKE_ABRUPT_TRANSITION
    - EVT_CORNER_ABRUPT_ENTRY
    - EVT_CORNER_ABRUPT_EXIT
    - EVT_ROAD_IMPACT
    - EVT_PHONE_MOVED
  confidence_reduction: limited_if_any_source_window_is_limited
  peak_selection: maximum_activation_ratio_with_earliest_tie
  decision_order: group_finalization_order

integrity_defaults:
  integrity_version: 1
  repeated_impossible_jump_unranked_count: 2
  questionable_source_conflict_duration_ms: 1000
  questionable_motion_without_imu_duration_ms: 2000
  states: [verified, limited_confidence, questionable, unranked]
  rank_eligibility:
    verified: eligible
    limited_confidence: eligible_with_limitations
    questionable: review_required
    unranked: ineligible
  finding_kinds: [quality_limitation, platform_signal, inconsistency, data_corruption]
  rules:
    INT_RAW_TRIP_INVALID: data_corruption
    INT_GNSS_MOCK_SIGNAL: platform_signal
    INT_GNSS_IMPOSSIBLE_JUMP: inconsistency
    INT_GNSS_SOURCE_SPEED_IMPLAUSIBLE: inconsistency
    INT_GNSS_SOURCE_GAP: quality_limitation
    INT_CLOCK_DISCONTINUITY: inconsistency
    INT_IMU_SOURCE_DROPOUT: quality_limitation
    INT_IMU_SENSOR_UNRELIABLE: quality_limitation
    INT_CROSS_SENSOR_DISAGREEMENT: inconsistency
    INT_PHONE_MOVEMENT_INVALIDATION: quality_limitation
    INT_MOTION_WITHOUT_IMU: inconsistency

confidence_states: [supported, limited]
severity_evidence:
  measured: physical_magnitude_and_activation_ratio
  phone_moved: unavailable_without_exposed_angle

events:
  EVT_ACCEL_STRONG:
    implementation_status: implemented_m4_2
    category: longitudinal
    display_name: Strong acceleration
    polarity: neutral
    expected_evidence: [longitudinal_acceleration, confirmed_movement, metric_eligibility]
  EVT_ACCEL_ABRUPT_TRANSITION:
    implementation_status: implemented_m4_2
    category: longitudinal
    display_name: Abrupt acceleration transition
    polarity: negative_candidate
    expected_evidence: [positive_longitudinal_jerk, positive_longitudinal_acceleration, confirmed_movement, metric_eligibility]
  EVT_BRAKE_STRONG:
    implementation_status: implemented_m4_2
    category: longitudinal
    display_name: Strong braking
    polarity: neutral
    expected_evidence: [negative_longitudinal_acceleration, confirmed_movement, metric_eligibility]
  EVT_BRAKE_ABRUPT_TRANSITION:
    implementation_status: implemented_m4_2
    category: longitudinal
    display_name: Abrupt braking transition
    polarity: negative_candidate
    expected_evidence: [negative_longitudinal_jerk, negative_longitudinal_acceleration, confirmed_movement, metric_eligibility]
  EVT_CORNER_HIGH_LOAD_LEFT:
    implementation_status: implemented_m4_2
    category: lateral
    display_name: High lateral-load left corner
    polarity: neutral
    expected_evidence: [positive_lateral_acceleration, confirmed_movement, metric_eligibility]
  EVT_CORNER_HIGH_LOAD_RIGHT:
    implementation_status: implemented_m4_2
    category: lateral
    display_name: High lateral-load right corner
    polarity: neutral
    expected_evidence: [negative_lateral_acceleration, confirmed_movement, metric_eligibility]
  EVT_CORNER_ABRUPT_ENTRY:
    implementation_status: implemented_m4_2
    category: lateral
    display_name: Abrupt corner entry
    polarity: negative_candidate
    expected_evidence: [lateral_jerk, increasing_lateral_load, confirmed_movement, metric_eligibility]
  EVT_CORNER_ABRUPT_EXIT:
    implementation_status: implemented_m4_2
    category: lateral
    display_name: Abrupt corner exit
    polarity: negative_candidate
    expected_evidence: [lateral_jerk, decreasing_lateral_load, confirmed_movement, metric_eligibility]
  EVT_ROAD_IMPACT:
    implementation_status: implemented_m4_2
    category: road_device
    display_name: Road impact or bump
    polarity: neutral
    expected_evidence: [vertical_acceleration, vertical_jerk, confirmed_movement, metric_eligibility]
  EVT_PHONE_MOVED:
    implementation_status: implemented_m4_2
    category: road_device
    display_name: Device moved during trip
    polarity: quality
    expected_evidence: [explicit_device_movement_invalidation, orientation_invalidated]
  EVT_GNSS_QUALITY_LOSS:
    implementation_status: pending_later_substep
    category: quality
    display_name: GNSS quality degraded
    polarity: quality
    severity_levels: [notice, significant, unusable]
    expected_evidence: [horizontal_accuracy, gap_duration, source_health]
  EVT_CRASH_LIKE_EVIDENCE:
    implementation_status: pending_later_substep
    category: safety
    display_name: Crash-like impact evidence
    polarity: safety
    severity_levels: [possible, strong]
    expected_evidence: [multi_axis_impact, speed_change, post_event_state, cross_sensor_agreement]
    rules:
      - Must never be decided by an LLM.
      - Must require high-confidence corroboration before Guardian Possible Crash state.
  EVT_TELEMETRY_INCONSISTENCY:
    implementation_status: implemented_m4_3
    category: integrity
    display_name: Telemetry inconsistency
    polarity: integrity
    severity_levels: [limited_confidence, questionable, unranked]
    expected_evidence: [gnss_imu_disagreement, impossible_motion, temporal_integrity, missing_inertial_corroboration]
    rules:
      - Umbrella ID applies only to inconsistency-kind integrity findings.
      - Quality limitations, platform mock signals, and data corruption retain distinct finding kinds.
      - Findings classify evidence and ranking eligibility, never malicious intent.
